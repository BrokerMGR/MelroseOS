<style id="mgr-responsive-system-v3">
:root{
  --mgr-max:1200px;
  --mgr-gutter:clamp(16px,3vw,32px);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box;}
html,body{width:100%;max-width:100%;overflow-x:hidden;}
body{margin:0;}
img,svg,video,canvas,iframe{max-width:100%;height:auto;}
table{max-width:100%;}
input,select,textarea,button{max-width:100%;font:inherit;}
button,a{-webkit-tap-highlight-color:transparent;}
.mgr-container,.container,.wrapper,.portal-shell,.portal-container{
  width:min(100% - (2 * var(--mgr-gutter)),var(--mgr-max));
  margin-left:auto;
  margin-right:auto;
}
.mgr-grid{
  display:grid;
  gap:clamp(14px,2vw,24px);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
}
.mgr-flex-wrap{display:flex;flex-wrap:wrap;gap:clamp(10px,2vw,20px);}
@media (max-width:1024px){.mgr-hide-tablet{display:none!important;}}
@media (max-width:768px){
  .mgr-stack-mobile,.mgr-stack-mobile>*{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
  }
  table.mgr-responsive-table{
    display:block;
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .mgr-mobile-center{text-align:center!important;}
}
@media (max-width:480px){
  :root{--mgr-gutter:14px;}
  body{font-size:15px;}
  h1{font-size:clamp(26px,8vw,36px);}
  h2{font-size:clamp(22px,7vw,30px);}
  button,.button,.btn,input[type="submit"]{min-height:44px;}
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<section id="rapAcademyCard" style="display:none;border:1px solid #e5e7eb;border-radius:14px;padding:24px;margin-top:24px;">
<h2>Melrose Group Realty Agent Academy</h2>
<p>Explore training, tools, and resources available to prospective and affiliated real estate professionals.</p>
<div id="rapAcademyInstructions"></div><div id="rapAcademyActions"></div>
<p id="rapAcademyDisclosure" style="font-size:12px;color:#6b7280;margin-top:20px;"></p>
</section>
<script>
function RAP_UI_loadAcademyCard(token,type){
 type=String(type||"").toUpperCase();
 if(["RECRUIT","RECRUITING","AGENT","NEW AGENT"].indexOf(type)===-1)return;
 document.getElementById("rapAcademyCard").style.display="block";
 google.script.run.withSuccessHandler(s=>RAP_UI_render(s,token)).RAP_getRecruitAcademyState(token);
}
function RAP_UI_render(s,token){
 if(!s||!s.success)return;
 document.getElementById("rapAcademyInstructions").textContent=s.instructions||"";
 document.getElementById("rapAcademyDisclosure").textContent=s.disclosure||"";
 const a=document.getElementById("rapAcademyActions");
 if(s.approved&&s.academyUrl){a.innerHTML='<a target="_blank" href="'+s.academyUrl+'" style="display:inline-block;padding:12px 20px;background:#172033;color:white;text-decoration:none;border-radius:7px;font-weight:bold;">Open Agent Academy</a>';return;}
 if(s.pending){a.innerHTML='<button disabled style="padding:12px 20px;">Access Request Under Review</button>';return;}
 a.innerHTML='<button id="rapRequestBtn" style="padding:12px 20px;background:#172033;color:white;border:0;border-radius:7px;font-weight:bold;">Request Academy Access</button>';
 document.getElementById("rapRequestBtn").onclick=function(){google.script.run.withSuccessHandler(x=>RAP_UI_render(x,token)).RAP_requestAcademyAccess(token);};
}
</script>
