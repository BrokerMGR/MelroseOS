<style>
.mos-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 30px rgba(16,35,63,.08)}.mos-card-header,.mos-card-body{padding:16px 18px}.mos-kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.mos-button{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:10px 14px}.mos-button.primary{background:#10233f;color:#fff}.mos-badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f8fafc;font-size:11px}.mos-toast-host{position:fixed;right:18px;bottom:18px;z-index:3000}.mos-toast{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 12px 30px rgba(16,35,63,.08)}
</style><div id="mos-toast-host" class="mos-toast-host"></div>
<script>
(function(){function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function card(o){return '<section class="mos-card">'+(o?.title?'<div class="mos-card-header"><strong>'+esc(o.title)+'</strong></div>':'')+'<div class="mos-card-body">'+(o?.html||'')+'</div></section>'}function kpi(v,l){return '<div class="mos-kpi"><strong>'+esc(v)+'</strong><span>'+esc(l)+'</span></div>'}function toast(m){const h=document.getElementById('mos-toast-host');if(!h)return;const e=document.createElement('div');e.className='mos-toast';e.textContent=m;h.appendChild(e);setTimeout(()=>e.remove(),3500)}window.MOS5UI={escapeHtml:esc,card,kpi,toast};})();
</script>
