<style>
.mos-workspace-shell{display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:calc(100vh - 72px)}.mos-workspace-shell.inspector-open{grid-template-columns:minmax(0,1fr) 360px}.mos-workspace-main{min-width:0}.mos-inspector{width:360px;background:#fff;border-left:1px solid #e2e8f0;transform:translateX(100%);transition:.2s;overflow-y:auto;position:sticky;top:72px;height:calc(100vh - 72px)}.mos-workspace-shell.inspector-open .mos-inspector{transform:translateX(0)}.mos-workspace-toolbar{display:flex;gap:10px;padding:14px 20px;background:#fff;border-bottom:1px solid #e2e8f0}.mos-workspace-toolbar button{border:1px solid #e2e8f0;background:#fff;border-radius:9px;padding:9px 12px}.mos-workspace-toolbar .primary{background:#10233f;color:#fff}.mos-workspace-status{margin-left:auto;font-size:11px;color:#697386}.mos-inspector-header{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #e2e8f0}.mos-inspector-body{padding:20px}
</style>
<div id="mos-workspace-shell" class="mos-workspace-shell"><section class="mos-workspace-main"><div class="mos-workspace-toolbar"><button id="mos-action-refresh">Refresh</button><button id="mos-action-inspector">Open Inspector</button><button id="mos-action-quick-create" class="primary">Quick Create</button><span id="mos-workspace-status" class="mos-workspace-status">Workspace ready</span></div><div id="mos-workspace-content-host"></div></section><aside id="mos-inspector" class="mos-inspector"><div class="mos-inspector-header"><h3 id="mos-inspector-title">Inspector</h3><button id="mos-inspector-close">×</button></div><div id="mos-inspector-body" class="mos-inspector-body">No record selected.</div></aside></div>
<script>
(function(){const b=id=>document.getElementById(id);function mount(){const h=b('mos-workspace-content-host'),d=document.querySelector('section.content'),r=b('mos-route-workspace');if(!h)return;if(d&&!h.contains(d))h.appendChild(d);if(r&&!h.contains(r))h.appendChild(r)}function open(){b('mos-workspace-shell')?.classList.add('inspector-open')}function close(){b('mos-workspace-shell')?.classList.remove('inspector-open')}window.MOS5Workspace={mountApplication:mount,openInspector:open,closeInspector:close};document.addEventListener('DOMContentLoaded',()=>{mount();if(b('mos-action-inspector'))b('mos-action-inspector').onclick=open;if(b('mos-inspector-close'))b('mos-inspector-close').onclick=close;if(b('mos-action-refresh'))b('mos-action-refresh').onclick=()=>location.reload();if(b('mos-action-quick-create'))b('mos-action-quick-create').onclick=()=>window.dispatchEvent(new CustomEvent('mos5:quick-create'))})})();
</script>
